services:
  portail:
    container_name: 'portail'
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=512"
      DATABASE_URL: postgresql://portail:portail@postgres:5432/portail?schema=public
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tty: true
    networks:
      - proxy

  postgres:
    image: postgres:16-alpine
    container_name: 'portail-postgres'
    restart: unless-stopped
    environment:
      POSTGRES_DB: portail
      POSTGRES_USER: portail
      POSTGRES_PASSWORD: portail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portail -d portail"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy

volumes:
  postgres_data:

networks:
  proxy:
    external: true
