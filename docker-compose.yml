services:
  portal:
    container_name: 'portal'
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.services.portal.loadbalancer.server.port=3000
      - traefik.http.routers.portal.rule=Host(`portal.maelbelliard.fr`)
      - traefik.http.routers.portal.service=portal
      - traefik.http.routers.portal.entrypoints=websecure
      - traefik.http.routers.portal.tls=true
      - traefik.http.routers.portal.tls.certresolver=ovh

networks:
  proxy:
    external: true
